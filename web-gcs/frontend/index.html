<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GCS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/top_bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        /* The GCS fills the window: the ribbon on top, the map below it, telemetry floating on the map */
        html,
        body {
            height: 100%;
            padding-top: 0 !important;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0a0a23;
        }

        /* Pills set their own display, which would otherwise beat the hidden attribute */
        [hidden] {
            display: none !important;
        }

        .nav-links {
            position: relative;
            /* Above the telemetry panel and map controls, so the More menu opens over them */
            z-index: 1100;
            flex: none;
            flex-wrap: wrap;
            gap: 8px 24px;
            height: auto;
            min-height: 90px;
            margin-bottom: 0;
            overflow: visible;
        }

        .nav-links .logo,
        .nav-links .company-name {
            margin-right: 0;
        }

        /* Join Us sits at the far right of the ribbon */
        .nav-links .nav-items {
            margin-left: auto;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border: none;
            border-radius: 999px;
            background: #0d2b6b;
            box-shadow: 0 4px 15px rgba(26, 58, 122, 0.4);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .pill:hover:not(:disabled) {
            background: #1a3a7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 58, 122, 0.6);
        }

        .pill:disabled {
            opacity: 0.45;
            box-shadow: none;
            cursor: not-allowed;
        }

        .pill.disconnected {
            background: #c62828;
        }

        .pill.disconnected:hover:not(:disabled) {
            background: #e53935;
        }

        .pill.connected {
            background: #2e7d32;
        }

        .pill.connected:hover:not(:disabled) {
            background: #388e3c;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
        }

        /* Altitude box and Takeoff button as one pill */
        .pill-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 4px 0 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(26, 58, 122, 0.25);
            color: #0d2b6b;
            font-size: 15px;
            font-weight: 600;
        }

        .pill-group input {
            width: 56px;
            height: 28px;
            padding: 0 6px;
            border: 1px solid #9fb3d9;
            border-radius: 8px;
            background: #fff;
            color: #0d2b6b;
            font: inherit;
        }

        .pill-group .pill {
            height: 32px;
            box-shadow: none;
        }

        /* The controls take the room between the logo and Join Us; the workshop buttons get what's left */
        #controls {
            flex: 1 1 0;
            min-width: 0;
        }
        #workshopBar {
            display: flex;
            flex: 1 1 0;
            gap: 10px;
            min-width: 0;
        }
        /* No overflow: hidden here, it would cut the pills' shadows off square.
           Pills that don't fit are moved under More instead */
        #workshopButtons {
            display: flex;
            flex: 0 1 auto;
            gap: 10px;
            min-width: 0;
        }
        #workshopButtons .pill,
        #moreMenu .pill {
            flex: none;
        }
        .more-wrap {
            position: relative;
            flex: none;
        }
        #moreMenu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 10px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 20px rgba(26, 58, 122, 0.35);
        }
        .pill.running {
            background: #2e7d32;
        }
        .pill.running:hover:not(:disabled) {
            background: #388e3c;
        }
        /* The plane: an arrow turned to its heading by script.js. No rotation animation,
           it would spin the long way round when the heading passes north */
        .drone-icon svg {
            width: 32px;
            height: 32px;
        }
        .drone-icon path {
            fill: #e53935;
            stroke: #fff;
            stroke-width: 1.5;
        }
        /* Everyone else's planes */
        .drone-icon.other svg {
            width: 26px;
            height: 26px;
        }
        .drone-icon.other path {
            fill: #757575;
        }
        .leaflet-tooltip.other-label {
            padding: 1px 6px;
            color: #555;
            font-size: 12px;
        }
        /* The landmark only we know about, for its head start */
        .leaflet-tooltip.hidden-label {
            background: #8e24aa;
            border-color: #6a1b9a;
            color: #fff;
            font-weight: 700;
        }
        .leaflet-tooltip.hidden-label::before {
            border-top-color: #6a1b9a;
        }
        /* Where the plane is flying to: like a waypoint, with a crosshair instead of a number */
        .target-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #1565c0;
            color: #fff;
            font-size: 14px;
        }
        .waypoint-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0d2b6b;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }
        .map-area {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        /* Score and telemetry float over the map bottom right, like the drone list on the live map */
        #sidePanels {
            position: absolute;
            right: 12px;
            bottom: 28px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;
        }

        .panel {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(17, 17, 17, 0.85);
            color: #fff;
            font-size: 14px;
        }

        .panel-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0;
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .panel-badge {
            padding: 2px 10px;
            border-radius: 999px;
            background: #c62828;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .panel-badge.online {
            background: #2e7d32;
        }

        .panel-badge.gold {
            background: #f9a825;
            color: #3e2700;
            font-weight: 700;
        }

        /* Folding slides: the body's single grid row animates between its full height and 0 */
        .panel-body {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.25s ease;
        }

        .panel-body > div {
            min-height: 0;
            overflow: hidden;
        }

        .panel.collapsed .panel-body {
            grid-template-rows: 0fr;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 12px;
            margin: 10px 0 0;
        }

        .telemetry-grid dt {
            color: #aaa;
        }

        .telemetry-grid dd {
            margin: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }


        @media (max-width: 1100px) {
            .nav-links .company-name {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .nav-links {
                gap: 8px;
                min-height: 0;
                padding: 8px 12px;
            }

            .nav-links .logo-img {
                width: 48px;
                height: 48px;
                margin-right: 0;
            }

            /* Logo and Join Us on the first row, the controls on their own row below */
            .nav-links .nav-items {
                order: 1;
            }

            #controls {
                order: 2;
                width: 100%;
            }

            /* The status is polled automatically anyway */
            #statusButton {
                display: none;
            }

            .pill,
            .pill-group {
                height: 36px;
                font-size: 14px;
            }

            .pill {
                padding: 0 14px;
            }

            .nav-links .nav-items li a.join-button {
                padding: 6px 12px;
                font-size: 14px;
            }

            #sidePanels {
                left: 12px;
                right: 12px;
                bottom: 24px;
                width: auto;
            }
        }
    </style>
</head>

<body>
    <ul class="nav-links">
        <!-- Logo and Company Name -->
        <img class="bg-svg" src="Icons/top_bar_background.svg" alt="Background SVG">
        <li class="logo">
            <a href="index.html?lang=en" style="text-decoration:none;">
                <img src="Icons/starbound_team_logo.svg" alt="Company Logo" class="logo-img">
            </a>
            <span class="company-name">
                <span class="company-title">StarBound</span>
                <span class="company-subtitle" data-en="An Aerospace Research Student Team"
                    data-el="Μια Φοιτητική Ομάδα Αεροδιαστημικής Έρευνας">An Aerospace Research Student Team</span>
            </span>
        </li>
        <!-- GCS controls -->
        <div id="controls">
            <button id="connectButton" class="pill disconnected"><span class="status-dot"></span>Connect to SITL</button>
            <button id="disconnectButton" class="pill connected" title="Click to disconnect" hidden><span class="status-dot"></span>Connected</button>
            <button id="statusButton" class="pill" disabled>Get Status</button>
            <div class="pill-group">
                <label for="altitudeInput">Alt (m)</label>
                <input type="number" id="altitudeInput" value="30" min="1">
                <button id="takeoffButton" class="pill" disabled>Takeoff</button>
            </div>
            <!-- One pill per @button function in workshop.py; what doesn't fit goes under More -->
            <div id="workshopBar">
                <div id="workshopButtons"></div>
                <div class="more-wrap">
                    <button id="moreButton" class="pill" hidden>More ▾</button>
                    <div id="moreMenu" hidden></div>
                </div>
            </div>
        </div>
        <!-- Navigation Links -->
        <div class="nav-items">
            <li><a href="https://docs.google.com/forms/d/e/1FAIpQLSdGUHR5nvLINE5B_iUFckAYPgUM81P3yGozB6FuNV6q6mYjOQ/viewform"
                    class="join-button" data-en="Join Us" data-el="Γίνε Μέλος" target="_blank">Join Us</a></li>
        </div>
    </ul>

    <main class="map-area">
        <div id="map"></div>

        <div id="sidePanels">
            <section id="score" class="panel">
                <button class="panel-toggle" type="button" title="Show or hide">
                    Score <span id="scoreBadge" class="panel-badge gold">0</span>
                </button>
                <div class="panel-body"><div><dl id="scoreData" class="telemetry-grid"></dl></div></div>
            </section>
            <section id="telemetry" class="panel">
                <button class="panel-toggle" type="button" title="Show or hide">
                    Telemetry <span id="telemetryState" class="panel-badge">offline</span>
                </button>
                <div class="panel-body"><div><dl id="telemetryData" class="telemetry-grid"></dl></div></div>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Bump ?v= whenever script.js changes, so browsers don't keep running a cached old copy -->
    <script src="script.js?v=18" defer></script>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet-contextmenu@1.4.0/dist/leaflet.contextmenu.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-contextmenu@1.4.0/dist/leaflet.contextmenu.min.js"></script>
</body>

</html>
