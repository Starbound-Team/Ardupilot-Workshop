<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: system-ui, sans-serif;
            background: #111;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        /* Drone list in the top right corner, sized to be readable on a projector */
        #panel {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            width: 320px;
            max-height: calc(100% - 32px);
            overflow-y: auto;
            padding: 16px;
            border-radius: 12px;
            background: rgba(17, 17, 17, 0.85);
            color: #fff;
        }

        #panel h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        #panel h1 span {
            color: #aaa;
            font-weight: normal;
        }

        .drone-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid #333;
        }

        .drone-row.stale {
            opacity: 0.4;
        }

        .swatch {
            flex: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .drone-name {
            font-size: 18px;
            font-weight: bold;
        }

        .drone-info {
            font-size: 14px;
            color: #ccc;
        }

        #offline {
            display: none;
            margin-top: 12px;
            padding: 8px;
            border-radius: 6px;
            background: #b00020;
            font-weight: bold;
        }

        #help {
            margin-top: 12px;
            font-size: 12px;
            color: #888;
        }

        /* No rotation animation: it would spin the long way round when a heading passes north */
        .drone-icon svg {
            width: 32px;
            height: 32px;
        }

        .drone-icon path {
            stroke: #fff;
            stroke-width: 1.5;
        }

        .drone-icon.stale {
            opacity: 0.35;
        }

        #round {
            margin: 0 0 12px;
            font-size: 20px;
            font-weight: bold;
        }

        #round:empty {
            display: none;
        }

        .money {
            margin-left: auto;
            font-size: 20px;
            font-weight: bold;
            color: #f9a825;
            font-variant-numeric: tabular-nums;
        }

        #sales {
            margin-top: 12px;
            font-size: 14px;
            color: #ccc;
        }

        #sales div {
            padding: 2px 0;
        }

        .leaflet-tooltip.landmark-label {
            font-size: 14px;
            font-weight: bold;
        }

        .leaflet-tooltip.drone-label {
            font-size: 15px;
            font-weight: bold;
            border-left-width: 6px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="panel">
        <h1>Live map <span id="count"></span></h1>
        <div id="round"></div>
        <div id="drone-list"></div>
        <div id="sales"></div>
        <div id="offline">Can't reach the live map server</div>
        <div id="help">F: fit all drones · T: show/hide trails</div>
    </div>

    <script>
        const START_VIEW = [39.360886, 22.945749]; // Workshop launch point
        const POLL_INTERVAL = 500; // ms
        const STALE_AFTER = 5; // Seconds without updates before a drone is shown as lost

        const map = L.map('map').setView(START_VIEW, 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const TRAIL_PIECES = 8; // Trails fade out towards the old end, drawn as this many pieces
        const layers = {}; // drone key -> { marker, trail }
        let game = null; // Latest /api/game: round, public landmarks, leaderboard, sales
        const landmarkLayer = L.layerGroup().addTo(map);
        let showTrails = true;
        let fittedOnce = false;

        function createDroneLayers(drone) {
            const icon = L.divIcon({
                className: 'drone-icon',
                html: `<svg viewBox="0 0 24 24"><path d="M12 2 L20 21 L12 17 L4 21 Z" fill="${drone.color}"/></svg>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
            });
            // The name comes from participants, so it's set as text, never as HTML
            const label = document.createElement('span');
            label.textContent = drone.name;

            const marker = L.marker([drone.lat, drone.lon], { icon })
                .bindTooltip(label, { permanent: true, direction: 'right', offset: [16, 0], className: 'drone-label' })
                .addTo(map);
            marker.getTooltip().getElement()?.style.setProperty('border-left-color', drone.color);

            const trail = L.layerGroup();
            for (let i = 0; i < TRAIL_PIECES; i++) {
                L.polyline([], { color: drone.color, weight: 3, opacity: 0.7 * (i + 1) / TRAIL_PIECES }).addTo(trail);
            }
            if (showTrails) trail.addTo(map);
            return { marker, trail };
        }

        function updateMap(drones) {
            const seen = new Set();
            for (const drone of drones) {
                seen.add(drone.key);
                layers[drone.key] ??= createDroneLayers(drone);
                const { marker, trail } = layers[drone.key];

                marker.setLatLng([drone.lat, drone.lon]);
                // Equal pieces, each sharing its end point with the next so there are no gaps
                const size = Math.ceil(drone.trail.length / TRAIL_PIECES);
                trail.getLayers().forEach((piece, i) => piece.setLatLngs(drone.trail.slice(i * size, (i + 1) * size + 1)));

                const stale = drone.age > STALE_AFTER;
                marker.getTooltip().setOpacity(stale ? 0.4 : 0.9);
                const element = marker.getElement();
                if (element) {
                    element.classList.toggle('stale', stale);
                    element.querySelector('svg').style.transform = `rotate(${drone.heading ?? 0}deg)`;
                }
            }

            // Drones that are gone from the server (after a reset)
            for (const key of Object.keys(layers)) {
                if (!seen.has(key)) {
                    layers[key].marker.remove();
                    layers[key].trail.remove();
                    delete layers[key];
                }
            }

            if (!fittedOnce && drones.length > 0) {
                fitAllDrones();
                fittedOnce = true;
            }
        }

        function clock(seconds) {
            const s = Math.max(0, Math.round(seconds));
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function describeRound(round) {
            const name = round.name === 'real' ? 'Real round' : 'Test round';
            switch (round.state) {
                case 'countdown': return `${name} starts in ${clock(round.starts_in)}`;
                case 'running': return `${name} · ${clock(round.seconds_left)} left`;
                case 'over': return `${name} over`;
                default: return '';
            }
        }

        // Public landmarks: a dot and the slice of ring they must be photographed from
        function offsetLatLng(lat, lon, distance, direction) {
            const d = direction * Math.PI / 180;
            return [lat + distance * Math.cos(d) / 111319.5,
                    lon + distance * Math.sin(d) / (111319.5 * Math.cos(lat * Math.PI / 180))];
        }

        // A new landmark announces itself with a ring that grows and fades, twice
        function ripple(lat, lon) {
            const ring = L.circleMarker([lat, lon], { radius: 7, color: '#f9a825', weight: 4, fill: false, interactive: false }).addTo(map);
            const start = performance.now();
            const PULSE = 750; // ms per pulse
            function step(now) {
                const t = (now - start) / PULSE;
                if (t >= 2) return ring.remove();
                ring.setRadius(7 + 50 * (t % 1));
                ring.setStyle({ opacity: 1 - t % 1 });
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        let shownLandmarks = null; // Names on the map after the last update; null = don't ripple the next ones
        let shownRound = null; // The round they were from
        let areaRectangle = null; // Where new landmarks can appear: it shrinks during a round

        function updateLandmarks() {
            landmarkLayer.clearLayers();
            // Everything is new when a round starts, so only ripple landmarks that appear during one
            const roundKey = game ? `${game.round.name}:${game.round.state}` : null;
            const ripples = shownLandmarks !== null && roundKey === shownRound;
            for (const lm of game?.landmarks ?? []) {
                // Fades with every sale, but stays visible: what's left can still be worth a detour
                const fade = Math.max(0.35, 1 - 0.2 * (lm.sales || 0));
                const zone = [];
                for (let i = 0; i <= 12; i++) zone.push(offsetLatLng(lm.lat, lm.lon, lm.outer, lm.approach_from - lm.view_width / 2 + lm.view_width * i / 12));
                for (let i = 12; i >= 0; i--) zone.push(offsetLatLng(lm.lat, lm.lon, lm.inner, lm.approach_from - lm.view_width / 2 + lm.view_width * i / 12));
                L.polygon(zone, { color: '#f9a825', weight: 1, opacity: fade, fillOpacity: 0.25 * fade }).addTo(landmarkLayer);
                L.circleMarker([lm.lat, lm.lon], { radius: 7, color: '#f9a825', opacity: fade, fillOpacity: fade })
                    .bindTooltip(`${lm.name} · ${lm.price}`, { permanent: true, direction: 'top', offset: [0, -7],
                                                              opacity: 0.9 * fade, className: 'landmark-label' })
                    .addTo(landmarkLayer);
                if (ripples && !shownLandmarks.has(lm.name)) ripple(lm.lat, lm.lon);
            }
            shownLandmarks = new Set((game?.landmarks ?? []).map(lm => lm.name));
            shownRound = roundKey;

            const area = game?.area;
            if (!area) {
                areaRectangle?.remove();
                areaRectangle = null;
            } else if (areaRectangle) {
                areaRectangle.setBounds([[area[0], area[1]], [area[2], area[3]]]);
            } else {
                areaRectangle = L.rectangle([[area[0], area[1]], [area[2], area[3]]],
                    { color: '#455a64', weight: 2, dashArray: '8 8', fill: false, interactive: false }).addTo(map);
            }
        }

        function updatePanel(drones) {
            document.getElementById('count').textContent = `(${drones.length})`;
            document.getElementById('round').textContent = game ? describeRound(game.round) : '';
            const list = document.getElementById('drone-list');
            list.replaceChildren();

            // During a round, the list is the leaderboard
            const money = new Map((game?.leaderboard ?? []).map(entry => [entry.name, entry.money]));
            const inRound = game && game.round.state !== 'idle';
            const order = inRound
                ? (a, b) => (money.get(b.name) ?? -1) - (money.get(a.name) ?? -1) || a.name.localeCompare(b.name)
                : (a, b) => a.name.localeCompare(b.name);
            for (const drone of [...drones].sort(order)) {
                const row = document.createElement('div');
                row.className = 'drone-row';
                row.classList.toggle('stale', drone.age > STALE_AFTER);

                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.background = drone.color;

                const name = document.createElement('div');
                name.className = 'drone-name';
                name.textContent = drone.name;

                const info = document.createElement('div');
                info.className = 'drone-info';
                if (drone.age > STALE_AFTER) {
                    info.textContent = `Signal lost ${Math.round(drone.age)} s ago`;
                } else {
                    const alt = drone.alt != null ? `${drone.alt.toFixed(1)} m` : '-';
                    const speed = drone.groundspeed != null ? `${drone.groundspeed.toFixed(1)} m/s` : '-';
                    info.textContent = `${drone.mode} · ${drone.armed ? 'armed' : 'disarmed'} · ${alt} · ${speed}`;
                }

                const text = document.createElement('div');
                text.append(name, info);
                row.append(swatch, text);
                if (inRound && money.has(drone.name)) {
                    const amount = document.createElement('div');
                    amount.className = 'money';
                    amount.textContent = money.get(drone.name);
                    row.append(amount);
                }
                list.append(row);
            }

            const sales = document.getElementById('sales');
            sales.replaceChildren(...(inRound ? game.sales : []).slice().reverse().map(sale => {
                const line = document.createElement('div');
                line.textContent = `${clock(sale.time)}  ${sale.name} sold ${sale.landmark} for ${sale.price}`;
                return line;
            }));
        }

        function fitAllDrones() {
            const positions = Object.values(layers).map(({ marker }) => marker.getLatLng());
            if (positions.length > 0) {
                map.fitBounds(L.latLngBounds(positions).pad(0.3), { maxZoom: 17 });
            }
        }

        function toggleTrails() {
            showTrails = !showTrails;
            for (const { trail } of Object.values(layers)) {
                showTrails ? trail.addTo(map) : trail.remove();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'f' || event.key === 'F') fitAllDrones();
            if (event.key === 't' || event.key === 'T') toggleTrails();
        });

        async function poll() {
            try {
                const response = await fetch('/api/drones');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const drones = await response.json();
                try {
                    game = await (await fetch('/api/game')).json();
                } catch (error) {
                    game = null;
                }
                updateLandmarks();
                updateMap(drones);
                updatePanel(drones);
                document.getElementById('offline').style.display = 'none';
            } catch (error) {
                console.error('Live map update failed:', error);
                document.getElementById('offline').style.display = 'block';
            } finally {
                setTimeout(poll, POLL_INTERVAL);
            }
        }

        poll();
    </script>
</body>

</html>
